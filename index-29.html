<style>

    --bg:#FAF7F0;
    --surface:#FFFFFF;
    --surface-2:#F1ECE0;
    --ink:#232323;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;

  }
  button{cursor:pointer;}
  .container{max-width:880px;margin:0 auto;padding:14px;}

  .brand{
    display:flex;align-items:center;gap:12px;

  .brand-right{margin-inline-start:auto;text-align:left;font-size:11px;color:#C9C2AC;}
  .brand-right b{display:block;color:#F4EFE1;font-size:13px;}
  .logout-btn{background:none;border:1px solid #4b564f;color:#C9C2AC;border-radius:8px;padding:4px 10px;font-size:11px;margin-top:6px;}

  /* ---------- Cards / layout ---------- */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line);}

  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=tel],input[type=number],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:11px;border:none;font-weight:700;font-size:14.5px;width:100%;}

  .btn-gold{background:var(--gold);color:#fff;}

  .step-item{display:flex;align-items:flex-start;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);}

  .step-check{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;background:#fff;}

  .step-body{flex:1;}
  .step-title{font-size:14px;font-weight:700;}
  .step-desc{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.8;}
  .step-time{display:inline-block;font-size:10px;color:var(--gold);margin-top:4px;font-weight:700;}
  .overall-bar-wrap{background:var(--surface-2);border-radius:20px;height:10px;overflow:hidden;margin:8px 0 4px;}
  .overall-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:20px;transition:width .3s;}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-box{background:var(--surface-2);border-radius:12px;padding:14px;text-align:center;}
  .stat-box .num{font-size:22px;font-weight:800;color:var(--teal);}
  .stat-box .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .lbl-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .bar-track{background:var(--surface-2);border-radius:10px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);border-radius:10px;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{max-width:400px;width:100%;}
  .auth-toggle{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px;}
  .auth-toggle button{flex:1;background:none;border:none;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .auth-toggle button.active{background:#fff;color:var(--teal);box-shadow:var(--shadow);}

  .modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-box{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:880px;max-height:88vh;overflow-y:auto;}
  .modal-box.centered{border-radius:18px;margin:20px;max-height:85vh;}

  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'><path fill='%236b6458' d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:10px center;padding-inline-start:32px;}
  #pdfRender{position:fixed;top:-9999px;left:-9999px;width:760px;background:#fff;padding:24px;font-family:'Vazirmatn',sans-serif;direction:rtl;}
  .loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--ink-soft);font-size:13px;}
  .empty-state{text-align:center;padding:30px 14px;color:var(--ink-soft);font-size:13px;}
  .field-view{padding:10px 0;border-bottom:1px dashed var(--line);}
  .field-view label{margin-bottom:2px;}
  .field-view .val{font-size:14px;font-weight:600;}
  .top-bar-inline{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .close-x{background:var(--surface-2);border:none;width:32px;height:32px;border-radius:10px;font-size:16px;color:var(--ink-soft);}
  .copycode{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-top:8px;}
  .copycode b{font-size:16px;letter-spacing:2px;color:var(--gold);}
</style>

<body>

<script>
/* ============================================================
   SUPABASE CONFIG — این دو خط را با اطلاعات پروژه سوپابیس خودتان
   جایگزین کنید (Settings > API در داشبورد Supabase)
   ============================================================ */
const SUPABASE_URL = "https://atrfyfwwhtzxarnpjnlu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aYLDrrZaFlA21dT4fViPbg_HMiSLDpK";
const CONFIG_OK = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
let sb = null;
if (CONFIG_OK) {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* ============================================================
   Jalali (Shamsi) calendar conversion helpers
   ============================================================ */
function div(a,b){return ~~(a/b);}
function jalCal(jy){
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  let bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm, jump=0, leap, n, i;
  if(jy<jp||jy>=breaks[bl-1]) throw new Error("Invalid Jalali year "+jy);
  for(i=1;i<bl;i+=1){jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ+=div(jump,33)*8+div(jump%33,4); jp=jm;}
  n=jy-jp; leapJ+=div(n,33)*8+div((n%33)+3,4);
  if((jump%33)===4 && jump-n===4) leapJ+=1;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  const march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div(jump+4,33)*33;
  leap=(((n+1)%33)-1)%4;
  if(leap===-1) leap=4;
  return {leap:leap,gy:gy,march:march};
}
function j2d(jy,jm,jd){
  const r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function g2d(gy,gm,gd){
  let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*((gm+9)%12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  let j=4*jdn+139361631; j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=div((j%1461),4)*5+308;
  const gd=div(i%153,5)+1;
  const gm=(div(i,153)%12)+1;
  const gy=div(j,1461)-100100+div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function d2j(jdn){
  const gy=d2g(jdn).gy; let jy=gy-621;
  const r=jalCal(jy);
  let jdn1f=g2d(gy,3,r.march);
  let k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){return {jy:jy,jm:1+div(k,31),jd:(k%31)+1};}
    k-=186;
  } else {
    jy-=1; k+=179;
    if(r.leap===1) k+=1;
  }
  return {jy:jy,jm:7+div(k,30),jd:(k%30)+1};
}
function gregToJalali(gy,gm,gd){return d2j(g2d(gy,gm,gd));}
function jalaliToGreg(jy,jm,jd){const g=d2g(j2d(jy,jm,jd));return g;}
function todayJalali(){const t=new Date(); const j=gregToJalali(t.getFullYear(),t.getMonth()+1,t.getDate()); return j;}
const JMONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const BADGE_OPTIONS=["بدون بج","بج اول","بج دوم","بج سوم","بج چهارم","بج پنجم","بج ششم"];
function badgeSelectHTML(id, currentVal){
  return `<select id="${id}">${BADGE_OPTIONS.map(b=>`<option value="${b}" ${currentVal===b?'selected':''}>${b}</option>`).join("")}</select>`;
}
function jStr(j){ if(!j) return ""; return `${j.jy}/${String(j.jm).padStart(2,"0")}/${String(j.jd).padStart(2,"0")}`; }
function jStrPretty(j){ if(!j) return ""; return `${j.jd} ${JMONTHS[j.jm-1]} ${j.jy}`; }
function parseJStr(s){
  if(!s) return null;
  const p=s.split("/"); if(p.length!==3) return null;
  return {jy:parseInt(p[0]), jm:parseInt(p[1]), jd:parseInt(p[2])};
}

/* ============================================================
   Checklist step definitions
   ============================================================ */
const STEPS = [
  {id:"s1", title:"تکمیل فرم مشاوره"},
  {id:"s2", title:"دیدن ویدئوی آشناسازی اولیه"},
  {id:"s3", title:"مطالعه جزوه یا دیدن آموزش شروع سریع"},
  {id:"s4", title:"دیدن ویدئوی ساخت پایگاه مشتریان"},
  {id:"s5", title:"دیدن ویدئوی آشناسازی ثانویه"},
  {id:"s6", title:"نوشتن لیست نفرات"},
  {id:"s7", title:"جلسه بررسی لیست"},
];
const LAST_STEP_ID = STEPS[STEPS.length-1].id;

/* ============================================================
   State
   ============================================================ */
let state = {
  leader: JSON.parse(localStorage.getItem("psha_leader") || "null"),
  allLeaders: [],
  entries: [],
  descendantCodes: new Set(),
  tab: "add",
  search: "",
  openEntry: null,
  loading: false,
  authMode: "login",
  errorMsg: "",
  successMsg: "",
  expandedLeaders: new Set(),
};

function saveSession(l){ localStorage.setItem("psha_leader", JSON.stringify(l)); state.leader=l; }
function logout(){ localStorage.removeItem("psha_leader"); state.leader=null; state.entries=[]; state.allLeaders=[]; render(); }
function genCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c=""; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

/* ============================================================
   Data loading
   ============================================================ */
async function loadAllLeaders(){
  const {data,error} = await sb.from("leaders").select("id,name,phone,code,parent_code,created_at");
  if(error){ console.error(error); return []; }
  return data||[];
}
function computeDescendants(rootCode, leaders){
  const set = new Set([rootCode]);
  let changed=true;
  while(changed){
    changed=false;
    for(const l of leaders){
      if(l.parent_code && set.has(l.parent_code) && !set.has(l.code)){ set.add(l.code); changed=true; }
    }
  }
  return set;
}
async function loadEntries(){
  const {data,error} = await sb.from("entries").select("*").order("created_at",{ascending:false});
  if(error){ console.error(error); return []; }
  return data||[];
}
async function refreshData(){
  state.loading=true; render();
  state.allLeaders = await loadAllLeaders();
  state.descendantCodes = computeDescendants(state.leader.code, state.allLeaders);
  const all = await loadEntries();
  state.entries = all.filter(e=>state.descendantCodes.has(e.leader_code));
  state.loading=false; render();
}

/* ============================================================
   Auth actions
   ============================================================ */
async function doForgotPassword(phone){
  state.errorMsg=""; state.successMsg="";
  if(!phone.trim()){ state.errorMsg="ابتدا شماره تماس خود را در بالا وارد کنید."; render(); return; }
  const {data,error} = await sb.from("leaders").select("id,name").eq("phone",phone.trim()).maybeSingle();
  if(error){ state.errorMsg="خطا در اتصال به سرور."; render(); return; }
  if(!data){ state.errorMsg="کاربری با این شماره یافت نشد."; render(); return; }
  if(!confirm(`رمز عبور حساب «${data.name}» بازنشانی شود؟ در ورود بعدی می‌توانید رمز جدید انتخاب کنید.`)) return;
  const {error:upErr} = await sb.from("leaders").update({password:null}).eq("phone",phone.trim());
  if(upErr){ state.errorMsg="خطا در بازنشانی رمز: "+upErr.message; render(); return; }
  state.successMsg="رمز عبور پاک شد. حالا در کادر بالا یک رمز جدید دلخواه وارد کنید و دوباره روی «ورود» بزنید.";
  render();
}
async function doLogin(phone,password){
  state.errorMsg=""; state.successMsg="";
  if(!phone.trim()){ state.errorMsg="شماره تماس را وارد کنید."; render(); return; }
  const {data,error} = await sb.from("leaders").select("*").eq("phone",phone.trim()).maybeSingle();
  if(error){ state.errorMsg="خطا در اتصال به سرور."; render(); return; }
  if(!data){ state.errorMsg="کاربری با این شماره یافت نشد. لطفاً ثبت‌نام کنید."; render(); return; }
  if(data.password){
    if(data.password!==password){ state.errorMsg="رمز عبور اشتباه است."; render(); return; }
  } else {
    if(!password || password.trim().length<4){
      state.errorMsg="برای این حساب هنوز رمز عبوری تنظیم نشده. یک رمز عبور (حداقل ۴ کاراکتر) وارد کنید تا از این پس رمز شما باشد."; render(); return;
    }
    const { error: upErr } = await sb.from("leaders").update({password:password.trim()}).eq("id",data.id);
    if(upErr){ state.errorMsg="خطا در تنظیم رمز عبور: "+upErr.message; render(); return; }
    data.password = password.trim();
  }
  saveSession(data);
  await refreshData();
}
async function doRegister(name,phone,uplineCode,ownCode,password){
  state.errorMsg=""; state.successMsg="";
  if(!name.trim()||!phone.trim()){ state.errorMsg="نام و شماره تماس الزامی است."; render(); return; }
  if(!password || password.trim().length<4){ state.errorMsg="رمز عبور باید حداقل ۴ کاراکتر باشد."; render(); return; }
  const cleanCode = ownCode.trim().toUpperCase();
  if(!/^[A-Za-z0-9]{4,6}$/.test(cleanCode)){
    state.errorMsg="کد اختصاصی باید بین ۴ تا ۶ حرف/رقم انگلیسی باشد."; render(); return;
  }
  const existingAll = await loadAllLeaders();
  if(existingAll.length>0 && !uplineCode.trim()){
    state.errorMsg="کد لیدر بالادستی الزامی است. این کد را از لیدر معرف خود بگیرید."; render(); return;
  }
  if(uplineCode.trim()){
    const up = existingAll.find(l=>l.code===uplineCode.trim().toUpperCase());
    if(!up){ state.errorMsg="کد لیدر بالادستی نامعتبر است."; render(); return; }
  }
  const dupPhone = existingAll.find(l=>l.phone===phone.trim());
  if(dupPhone){ state.errorMsg="این شماره قبلاً ثبت‌نام کرده است. وارد شوید."; render(); return; }
  const dupCode = existingAll.find(l=>l.code===cleanCode);
  if(dupCode){ state.errorMsg="این کد قبلاً توسط شخص دیگری انتخاب شده. کد دیگری وارد کنید."; render(); return; }
  const code = cleanCode;
  const row={ name:name.trim(), phone:phone.trim(), code, password: password.trim(), parent_code: uplineCode.trim()? uplineCode.trim().toUpperCase() : null };
  const {data,error} = await sb.from("leaders").insert(row).select().single();
  if(error){ state.errorMsg="خطا در ثبت‌نام: "+error.message; render(); return; }
  saveSession(data);
  await refreshData();
}

/* ============================================================
   Entry actions
   ============================================================ */
function blankEntryForm(){
  return {
    member_name:"", introducer_name: state.leader?state.leader.name:"", presenter_name:"",
    presenter_date:"", start_amount:"بدون بج", registration_date: jStr(todayJalali()),
    business_type:"none",
    notes:""
  };
}
let entryForm = blankEntryForm();

async function createEntry(){
  state.errorMsg="";
  if(!entryForm.member_name.trim()){ state.errorMsg="نام تازه‌ورودی الزامی است."; render(); return; }
  const checklist={}; STEPS.forEach(s=>checklist[s.id]=false);
  const row = {
    leader_code: state.leader.code,
    member_name: entryForm.member_name.trim(),
    introducer_name: entryForm.introducer_name.trim(),
    presenter_name: entryForm.presenter_name.trim(),
    presenter_date: entryForm.presenter_date,
    start_amount: entryForm.start_amount || "بدون بج",
    registration_date: entryForm.registration_date,
    business_type: entryForm.business_type,
    notes: entryForm.notes,
    checklist
  };
  const {data,error} = await sb.from("entries").insert(row).select().single();
  if(error){ state.errorMsg="خطا در ذخیره‌سازی: "+error.message; render(); return; }
  entryForm = blankEntryForm();
  await refreshData();
  state.tab="list"; state.openEntry=data; render();
}
async function updateEntryField(entry, field, value){
  entry[field]=value;
  const {error} = await sb.from("entries").update({[field]:value}).eq("id",entry.id);
  if(error) console.error(error);
}
async function toggleStepLocal(entry, stepId, checkEl){
  entry.checklist[stepId] = !entry.checklist[stepId];
  if(entry.checklist[stepId]){ checkEl.classList.add("checked"); checkEl.textContent="✓"; }
  else { checkEl.classList.remove("checked"); checkEl.textContent=""; }
  const pct=completionPct(entry);
  const bar=document.getElementById("overallBar");
  if(bar) bar.style.width=pct+"%";
  const txt=document.getElementById("overallText");
  if(txt) txt.textContent=`${pct}% مراحل تکمیل شده (${STEPS.filter(s=>entry.checklist[s.id]).length} از ${STEPS.length})`;
  if(stepId===LAST_STEP_ID){
    const unlocked = !!entry.checklist[stepId];
    ["ef_training_end_date_d","ef_training_end_date_m","ef_training_end_date_y"].forEach(id=>{
      const el=document.getElementById(id); if(el) el.disabled=!unlocked;
    });
    const hint=document.getElementById("trainingLockHint");
    if(hint) hint.style.display = unlocked ? "none" : "block";
  }
  const { error } = await sb.from("entries").update({checklist: entry.checklist}).eq("id", entry.id);
  if(error){ console.error(error); return; }
  const toast=document.getElementById("saveToast");
  if(toast){ toast.textContent="✔ ذخیره شد"; toast.style.display="block"; clearTimeout(toast._hideTimer); toast._hideTimer=setTimeout(()=>{ toast.style.display="none"; },1200); }
}
async function deleteEntry(entry){
  if(!confirm2("این تازه‌ورودی حذف شود؟ این عمل غیرقابل بازگشت است.")) return;
  const {error} = await sb.from("entries").delete().eq("id",entry.id);
  if(error){ alert("خطا در حذف"); return; }
  state.openEntry=null;
  await refreshData();
}
function confirm2(msg){ return window.confirm(msg); } // iOS-safe wrapper kept for consistency

function completionPct(entry){
  const total=STEPS.length; let done=0;
  STEPS.forEach(s=>{ if(entry.checklist && entry.checklist[s.id]) done++; });
  return Math.round(done/total*100);
}
function ringColor(pct){
  if(pct>=100) return "var(--teal)";
  if(pct>=50) return "var(--gold)";
  return "#B8A98A";
}

function jalaliPickerHTML(prefix, valueStr, label, disabled){
  const ty=todayJalali().jy;
  const v = parseJStr(valueStr) || {jy: ty};
  const years=[];
  for(let y=ty-2;y<=ty+2;y++) years.push(y);
  let opt=(list,cur)=>list.map(x=>`<option value="${x}" ${String(x)===String(cur)?'selected':''}>${x}</option>`).join("");
  const dis = disabled ? "disabled" : "";
  return `
  <div class="field">
    <label>${label}</label>
    <div class="jalali-row">
      <select id="${prefix}_d" ${dis}>
        <option value="">روز</option>
        ${opt(Array.from({length:31},(_,i)=>i+1), v.jd)}
      </select>
      <select id="${prefix}_m" ${dis}>
        <option value="">ماه</option>
        ${JMONTHS.map((m,i)=>`<option value="${i+1}" ${String(i+1)===String(v.jm)?'selected':''}>${m}</option>`).join("")}
      </select>
      <select id="${prefix}_y" ${dis}>
        <option value="">سال</option>
        ${opt(years, v.jy)}
      </select>
    </div>
  </div>`;
}
function readJalaliPicker(prefix){
  const d=document.getElementById(prefix+"_d").value;
  const m=document.getElementById(prefix+"_m").value;
  const y=document.getElementById(prefix+"_y").value;
  if(!d||!m||!y) return "";
  return jStr({jy:y,jm:m,jd:d});
}

function buildLeaderHierarchy(rootCode, allLeaders){
  const byParent={};
  allLeaders.forEach(l=>{
    const p = l.parent_code || "__none__";
    (byParent[p]=byParent[p]||[]).push(l);
  });
  Object.values(byParent).forEach(arr=>arr.sort((a,b)=>a.name.localeCompare(b.name,'fa')));
  const rootLeader = allLeaders.find(l=>l.code===rootCode);
  const ordered=[];
  if(rootLeader) ordered.push({leader:rootLeader, depth:0});
  function walk(code, depth){
    const children = byParent[code]||[];
    children.forEach(ch=>{
      ordered.push({leader:ch, depth});
      walk(ch.code, depth+1);
    });
  }
  walk(rootCode, 1);
  return ordered;
}

  const stepStats = STEPS.map(s=>{

          <div class="field"><label>نام پرزنتور</label><input type="text" id="ef_presenter_name" value="${e.presenter_name||''}"></div>

        ${jalaliPickerHTML("ef_training_end_date", e.training_end_date, "تاریخ اتمام آموزش‌ها", !e.checklist[LAST_STEP_ID])}

      <button class="btn btn-gold" id="btnSaveEntryInfo" style="margin-bottom:10px;">ذخیره تغییرات</button>
      <button class="btn btn-danger" id="btnDeleteEntry">حذف این تازه‌ورودی</button>
    </div>
  </div>`;
}

/* ============================================================
   Event wiring
   ============================================================ */
function attachMainEvents(){
  const logoutBtn=document.getElementById("btnLogout");
  if(logoutBtn) logoutBtn.onclick=logout;

  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.onclick=()=>{ state.tab=b.dataset.tab; state.errorMsg=""; render(); };
  });

  if(state.tab==="add"){
    const btn=document.getElementById("btnCreateEntry");
    if(btn) btn.onclick=()=>{ collectAddForm(); createEntry(); };
  }
  if(state.tab==="list"){
    const s=document.getElementById("searchInput");
    if(s){ s.oninput=()=>{ state.search=s.value; render(); document.getElementById("searchInput").focus(); document.getElementById("searchInput").selectionStart=document.getElementById("searchInput").value.length; }; }
    document.querySelectorAll(".entry-item").forEach(it=>{
      it.onclick=()=>{ const id=it.dataset.id; state.openEntry = state.entries.find(e=>e.id===id); render(); };
    });
  }
  if(state.tab==="team"){
    const cp=document.getElementById("btnCopyCode");
    if(cp) cp.onclick=()=>{ navigator.clipboard?.writeText(state.leader.code); cp.textContent="کپی شد!"; setTimeout(()=>{cp.textContent="کپی";},1500); };
    document.querySelectorAll(".leader-row").forEach(row=>{
      row.onclick=()=>{
        const code=row.dataset.leader;
        if(state.expandedLeaders.has(code)) state.expandedLeaders.delete(code);
        else state.expandedLeaders.add(code);
        render();
      };
    });
    document.querySelectorAll(".entrant-row").forEach(row=>{
      row.onclick=(ev)=>{
        ev.stopPropagation();
        const id=row.dataset.id;
        state.openEntry = state.entries.find(e=>e.id===id);
        render();
      };
    });
    document.querySelectorAll(".reset-pass-btn").forEach(btn=>{
      btn.onclick=async (ev)=>{
        ev.stopPropagation();
        const code=btn.dataset.code, name=btn.dataset.name;
        if(!confirm(`رمز عبور «${name}» بازنشانی شود؟ او باید دفعه بعد با شماره‌اش وارد شود و یک رمز جدید تعیین کند.`)) return;
        btn.disabled=true; btn.textContent="در حال انجام...";
        const {error} = await sb.from("leaders").update({password:null}).eq("code",code);
        btn.disabled=false;
        if(error){ alert("خطا در بازنشانی رمز: "+error.message); return; }
        btn.textContent="بازنشانی شد ✔";
        setTimeout(()=>{ btn.textContent="بازنشانی رمز"; },2000);
      };
    });
  }
  if(state.tab==="pdf"){
    const ptype=document.getElementById("pdfPeriodType");
    if(ptype) ptype.onchange=()=>{
      document.getElementById("pdfWeekWrap").style.display = ptype.value==='week'?'block':'none';
      document.getElementById("pdfMonthWrap").style.display = ptype.value==='month'?'block':'none';
    };
    const btn=document.getElementById("btnGenPdf");
    if(btn) btn.onclick=generatePdf;
  }

  if(state.openEntry){
    const closeBtn=document.getElementById("closeModal");
    if(closeBtn) closeBtn.onclick=()=>{ state.openEntry=null; render(); };
    const bg=document.getElementById("modalBg");
    if(bg) bg.onclick=(ev)=>{ if(ev.target.id==='modalBg'){ state.openEntry=null; render(); } };

    document.querySelectorAll(".step-check").forEach(chk=>{
      chk.onclick=()=> toggleStepLocal(state.openEntry, chk.dataset.step, chk);
    });
    const saveBtn=document.getElementById("btnSaveEntryInfo");
    if(saveBtn) saveBtn.onclick=async ()=>{
      const e=state.openEntry;
      const updates={
        introducer_name:document.getElementById("ef_introducer_name").value,
        presenter_name:document.getElementById("ef_presenter_name").value,
        presenter_date:readJalaliPicker("ef_presenter_date"),
        start_amount:document.getElementById("ef_start_amount").value,
        business_type:document.getElementById("ef_business_type").value,
        registration_date:readJalaliPicker("ef_registration_date"),
        notes:document.getElementById("ef_notes").value,
        checklist: e.checklist,
      };
      if(e.checklist[LAST_STEP_ID]){
        updates.training_end_date = readJalaliPicker("ef_training_end_date");
      }
      saveBtn.disabled=true; saveBtn.textContent="در حال ذخیره...";
      Object.assign(e,updates);
      const {error} = await sb.from("entries").update(updates).eq("id",e.id);
      saveBtn.disabled=false; saveBtn.textContent="ذخیره تغییرات";
      if(error){ alert("خطا در ذخیره‌سازی: "+error.message); return; }
      const toast=document.getElementById("saveToast");
      if(toast){ toast.style.display="block"; setTimeout(()=>{ toast.style.display="none"; },2000); }
    };
    const delBtn=document.getElementById("btnDeleteEntry");
    if(delBtn) delBtn.onclick=()=>deleteEntry(state.openEntry);
  }
}

/* ============================================================
   PDF generation
   ============================================================ */
function entryInPeriod(e, periodType, year, week, month){
  const rd = parseJStr(e.registration_date);
  if(!rd) return false;
  if(rd.jy!=year) return false;
  if(periodType==='month') return rd.jm==month;
  // week: approximate day-of-year based 7-day buckets
  const dayOfYear = (rd.jm-1)*30 + rd.jd; // approximation, fine for reporting buckets
  const wk = Math.ceil(dayOfYear/7);
  return wk==week;
}

async function generatePdf(){
  const periodType=document.getElementById("pdfPeriodType").value;
  const year=document.getElementById("pdfYear").value;
  const week=document.getElementById("pdfWeek").value;
  const month=document.getElementById("pdfMonth").value;

  const filtered = state.entries.filter(e=>entryInPeriod(e,periodType,year,week,month));
  const total=filtered.length;
  const avgPct= total? Math.round(filtered.reduce((s,e)=>s+completionPct(e),0)/total):0;
  const small=filtered.filter(e=>e.business_type==='small').length;
  const large=filtered.filter(e=>e.business_type==='large').length;

  const periodLabel = periodType==='week' ? `هفته ${week} سال ${year}` : `${JMONTHS[month-1]} ${year}`;

  const html = `
    <div style="text-align:center;margin-bottom:18px;">
      <div style="font-size:20px;font-weight:800;color:#1F2937;">پله‌های صعود همکاران جدید</div>
      <div style="font-size:13px;color:#6b6458;margin-top:4px;">گزارش ${periodType==='week'?'هفتگی':'ماهانه'} — ${periodLabel}</div>
      <div style="font-size:12px;color:#6b6458;">لیدر: ${state.leader.name} (کد ${state.leader.code})</div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <div style="flex:1;background:#F1ECE0;border-radius:10px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#2F6F63;">${total}</div>
        <div style="font-size:11px;color:#6b6458;">تازه‌ورودی در بازه</div>
      </div>
      <div style="flex:1;background:#F1ECE0;border-radius:10px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#2F6F63;">${avgPct}%</div>
        <div style="font-size:11px;color:#6b6458;">میانگین پیشرفت</div>
      </div>
      <div style="flex:1;background:#F1ECE0;border-radius:10px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#2F6F63;">${small}/${large}</div>
        <div style="font-size:11px;color:#6b6458;">کوچک/بزرگ</div>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:11.5px;">
      <thead>
        <tr style="background:#22302B;color:#fff;">
          <th style="padding:8px;text-align:right;">نام تازه‌ورودی</th>
          <th style="padding:8px;text-align:right;">معرف</th>
          <th style="padding:8px;text-align:right;">تاریخ ثبت‌نام</th>
          <th style="padding:8px;text-align:right;">کسب‌وکار</th>
          <th style="padding:8px;text-align:right;">پیشرفت</th>
        </tr>
      </thead>
      <tbody>
        ${filtered.map((e,i)=>`
          <tr style="background:${i%2===0?'#fff':'#FAF7F0'};">
            <td style="padding:7px 8px;border-bottom:1px solid #E4DCC9;">${e.member_name}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #E4DCC9;">${e.introducer_name||'—'}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #E4DCC9;">${e.registration_date||'—'}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #E4DCC9;">${e.business_type==='large'?'بزرگ':'کوچک'}</td>
            <td style="padding:7px 8px;border-bottom:1px solid #E4DCC9;">${completionPct(e)}%</td>
          </tr>`).join("")}
      </tbody>
    </table>
    ${total===0?'<div style="text-align:center;padding:30px;color:#6b6458;">تازه‌ورودی در این بازه ثبت نشده است.</div>':''}
  `;
  const renderDiv=document.getElementById("pdfRender");
  renderDiv.innerHTML=html;
  renderDiv.style.top="0"; renderDiv.style.left="0"; renderDiv.style.zIndex="-1";

  const canvas = await html2canvas(renderDiv, {scale:2});
  renderDiv.style.top="-9999px"; renderDiv.style.left="-9999px";
  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const imgWidth = pageWidth - 40;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  pdf.addImage(imgData, "PNG", 20, 20, imgWidth, imgHeight);
  pdf.save(`گزارش_${periodType==='week'?'هفتگی':'ماهانه'}_${periodLabel}.pdf`);
}
